name: Build map and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # nightly, after webref's crawl
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Raw sources: refs files are keyed by crawl date, so most are reused between runs
      - uses: actions/cache@v6
        with:
          path: data/cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      # Latest node positions keep the geography stable from one build to the next.
      # Falls back to the committed data/layout-seed.json.
      - uses: actions/cache@v6
        with:
          path: data/layout-seed.json
          key: layout-seed-${{ github.run_id }}
          restore-keys: layout-seed-

      - name: Build map data
        run: npm run data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

      - name: Build site
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
